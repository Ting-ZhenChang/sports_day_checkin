<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR 查詢看板 | ACES Visionflow</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-bg">
    <main class="app-shell wide">
      <header class="brand-header">
        <div class="brand-mark">ACES <span>DTD</span></div>
        <h1>HR 查詢看板</h1>
        <p>即時報到狀況 · 補登記 · 修改人數</p>
      </header>

      <div class="page-body">
        <div class="topbar">
          <div>
            <h2>報到總覽</h2>
            <p>每 5 秒自動更新，最後更新：<span id="updatedAt">-</span></p>
          </div>
          <button id="walkinBtn" class="primary-btn">＋ 補登記</button>
        </div>

        <div class="stats-grid">
          <div class="stat-card"><span>應報到</span><strong id="statExpected">0</strong><small id="statExpectedSub"></small></div>
          <div class="stat-card"><span>實際報到</span><strong id="statActual">0</strong><small id="statActualSub"></small></div>
          <div class="stat-card"><span>未報到</span><strong id="statMissing">0</strong><small id="statMissingSub"></small></div>
          <div class="stat-card"><span>已領取</span><strong id="statClaimed">0</strong><small id="statClaimedSub"></small></div>
        </div>

        <div class="filter-bar">
          <select id="teamFilter" class="input compact" aria-label="小隊"></select>
          <select id="unitFilter" class="input compact" aria-label="部門"></select>
          <input id="idFilter" class="input compact" type="text" placeholder="工號" autocomplete="off" />
          <input id="nameFilter" class="input compact" type="text" placeholder="姓名" autocomplete="off" />
          <button id="clearFilterBtn" class="ghost-btn">清除</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>工號</th>
                <th>姓名</th>
                <th>單位</th>
                <th>小隊</th>
                <th>填寫眷屬</th>
                <th>報到眷屬</th>
                <th>金額</th>
                <th>報到</th>
                <th>領取</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <footer>© 2026 ACES DTD. ALL RIGHTS RESERVED.</footer>
    </main>
  </div>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/hr.js"></script>
</body>
</html>
