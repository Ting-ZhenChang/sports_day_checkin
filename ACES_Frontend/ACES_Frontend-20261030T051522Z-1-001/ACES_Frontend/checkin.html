<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>報到 | ACES </title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-bg">
    <main class="app-shell">
      <header class="brand-header">
        <div class="brand-mark">ACES <span>DTD</span></div>
        <h1>現場報到</h1>
        <p>報到工作人員專用</p>
      </header>

      <div class="page-body">
        <!-- 1. 輸入自己的工號（只記錄是誰操作，不做驗證） -->
        <section id="loginView" class="card">
          <span class="eyebrow">STAFF</span>
          <h2>請輸入您的工號</h2>
          <p class="lead">系統只會記錄是誰操作報到。</p>
          <label class="field-label" for="operatorInput">工號</label>
          <input id="operatorInput" class="input" type="text" placeholder="例如：T12345" autocomplete="off" autocapitalize="characters" />
          <p id="operatorError" class="error-text"></p>
          <button id="startBtn" class="primary-btn">開始報到</button>
        </section>

        <!-- 2. 掃 QR code -->
        <section id="scanView" hidden>
          <div class="operator-bar">
            <span>報到人員：<strong id="operatorLabel"></strong></span>
            <button id="changeOperatorBtn" class="link-btn" type="button">更換工號</button>
          </div>

          <div class="scan-box"><video id="video" playsinline muted></video></div>
          <p class="scan-hint">請將員工的 QR code 對準框內</p>
          <p id="scanError" class="scan-error" hidden></p>

          <div class="manual-box">
            <button id="manualToggle" class="link-btn" type="button">無法掃描？手動輸入代碼</button>
            <form id="manualForm" class="manual-form" hidden>
              <input id="manualInput" class="input" type="text" placeholder="16 碼代碼" autocomplete="off" />
              <button class="primary-btn" type="submit">查詢</button>
            </form>
          </div>
        </section>

        <!-- 3. 確認報到人數 -->
        <section id="resultView" class="card" hidden>
          <span class="eyebrow">CHECK-IN</span>
          <h2 id="rName"></h2>
          <p class="lead"><span id="rEmpId"></span>　<span id="rUnit"></span>　<span id="rTeam"></span></p>

          <div class="big-people">
            <div class="row"><span>員工</span><span>1 人</span></div>
          </div>

          <label class="field-label">眷屬人數（表單填寫 <span id="rDeclared"></span> 人）</label>
          <div id="stepperSlot"></div>

          <div class="big-people" style="margin-top:16px">
            <div class="row total"><span>合計</span><span id="rTotal"></span></div>
          </div>

          <button id="confirmBtn" class="primary-btn">確認報到</button>
          <button id="cancelBtn" class="ghost-btn full">取消，掃下一位</button>
        </section>

        <!-- 已報到 / 查無此人 -->
        <section id="noticeView" class="card center" hidden>
          <div id="noticeIcon" class="status-icon warn">!</div>
          <h2 id="noticeTitle"></h2>
          <p id="noticeText" class="lead"></p>
          <button id="noticeBtn" class="primary-btn">掃下一位</button>
        </section>
      </div>

      <footer>© 2026 ACES DTD. ALL RIGHTS RESERVED.</footer>
    </main>
  </div>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/vendor/jsQR.js"></script>
  <script src="js/config.js"></script>
  <script src="js/rest-api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/checkin.js"></script>
</body>
</html>
